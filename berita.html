<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kabar & Berita - ScoutDupta</title>
  
  <link rel="icon" type="image/png" href="https://pradupta.my.id/img/logo.png" />
  <link rel="apple-touch-icon" href="https://pradupta.my.id/img/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body class="bg-slate-50 min-h-screen pb-24 text-slate-800 antialiased">

  <!-- Header -->
  <header class="header-app p-6 pb-8 text-white sticky top-0 z-30">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/index.html" class="w-10 h-10 rounded-2xl bg-white/10 hover:bg-white/20 border border-white/20 flex items-center justify-center text-white active:scale-95 transition">
          <i class="fas fa-arrow-left"></i>
        </a>
        <div>
          <p class="text-[10px] text-red-200 font-bold uppercase tracking-wider">Portal Informasi</p>
          <h1 class="text-xl font-extrabold tracking-tight">KABAR DUPTA</h1>
        </div>
      </div>
      <img src="https://pradupta.my.id/img/logo.png" alt="Logo" class="w-10 h-10 object-contain drop-shadow-md" onerror="this.src='https://pradupta.github.io/web/img/logo.png'">
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 py-4 space-y-4">

    <!-- Search & Filter -->
    <div class="space-y-2.5">
      <div class="relative">
        <i class="fas fa-search absolute left-4 top-3.5 text-slate-400 text-xs"></i>
        <input type="text" id="search-input" placeholder="Cari judul atau topik berita..." class="form-input pl-10 text-xs shadow-sm">
      </div>

      <!-- Categories Pills -->
      <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar text-xs">
        <button onclick="setCategory('Semua')" class="cat-pill active px-3.5 py-1.5 rounded-full font-bold whitespace-nowrap bg-red-600 text-white shadow-sm transition">Semua</button>
        <button onclick="setCategory('Kegiatan')" class="cat-pill px-3.5 py-1.5 rounded-full font-bold whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:border-red-300 transition">Kegiatan</button>
        <button onclick="setCategory('Kebijakan')" class="cat-pill px-3.5 py-1.5 rounded-full font-bold whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:border-red-300 transition">Kebijakan</button>
        <button onclick="setCategory('Pelatihan')" class="cat-pill px-3.5 py-1.5 rounded-full font-bold whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:border-red-300 transition">Pelatihan</button>
        <button onclick="setCategory('Prestasi')" class="cat-pill px-3.5 py-1.5 rounded-full font-bold whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:border-red-300 transition">Prestasi</button>
      </div>
    </div>

    <!-- Articles Feed -->
    <div id="articles-feed" class="space-y-3">
      <!-- Loading Skeleton -->
      <div class="p-3 bg-white rounded-2xl flex gap-3 shadow-sm border border-slate-100 animate-pulse">
        <div class="w-24 h-24 bg-slate-200 rounded-xl shrink-0"></div>
        <div class="flex-1 space-y-2 py-2">
          <div class="h-4 bg-slate-200 rounded w-5/6"></div>
          <div class="h-3 bg-slate-200 rounded w-1/2"></div>
          <div class="h-3 bg-slate-200 rounded w-1/4"></div>
        </div>
      </div>
      <div class="p-3 bg-white rounded-2xl flex gap-3 shadow-sm border border-slate-100 animate-pulse">
        <div class="w-24 h-24 bg-slate-200 rounded-xl shrink-0"></div>
        <div class="flex-1 space-y-2 py-2">
          <div class="h-4 bg-slate-200 rounded w-4/6"></div>
          <div class="h-3 bg-slate-200 rounded w-2/3"></div>
          <div class="h-3 bg-slate-200 rounded w-1/3"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- Bottom Navigation Bar (STATIS & HANYA 3 IKON: Home, Berita, Absen) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 py-2.5 z-40 shadow-lg">
    <div class="max-w-md mx-auto grid grid-cols-3 text-center">
      <a href="/index.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-red-600 active:scale-90 transition-transform duration-150">
        <i class="fas fa-home text-lg"></i>
        <span class="text-[10px] font-extrabold mt-0.5">Home</span>
      </a>
      <a href="/berita.html" class="flex flex-col items-center justify-center text-red-600 active:scale-90 transition-transform duration-150">
        <i class="fas fa-newspaper text-lg"></i>
        <span class="text-[10px] font-extrabold mt-0.5">Berita</span>
      </a>
      <a href="/absen.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-red-600 active:scale-90 transition-transform duration-150">
        <i class="fas fa-camera text-lg"></i>
        <span class="text-[10px] font-extrabold mt-0.5">Absen</span>
      </a>
    </div>
  </nav>

  <script type="module">
    import { db } from "/assets/js/firebase-config.js";
    import { collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { formatDateIndo } from "/assets/js/utils.js";

    let allArticles = [];
    let activeCategory = 'Semua';
    let searchQuery = '';

    const feedEl = document.getElementById("articles-feed");
    const searchEl = document.getElementById("search-input");

    const q = query(collection(db, "articles"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      allArticles = [];
      snapshot.forEach(doc => {
        allArticles.push({ id: doc.id, ...doc.data() });
      });
      renderList();
    });

    function renderList() {
      const filtered = allArticles.filter(item => {
        const matchCat = activeCategory === 'Semua' || (item.kategori && item.kategori.toLowerCase() === activeCategory.toLowerCase());
        const matchSearch = !searchQuery || 
          (item.judul && item.judul.toLowerCase().includes(searchQuery.toLowerCase())) ||
          (item.penulis && item.penulis.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        feedEl.innerHTML = `
          <div class="py-16 text-center bg-white rounded-3xl border border-slate-100 text-slate-400 p-6">
            <i class="far fa-newspaper text-4xl mb-3 text-slate-300"></i>
            <h4 class="font-bold text-slate-700 text-sm">Tidak Ada Artikel</h4>
            <p class="text-xs text-slate-400 mt-1">Coba kata kunci pencarian atau kategori lain.</p>
          </div>
        `;
        return;
      }

      feedEl.innerHTML = filtered.map(item => {
        const dateStr = formatDateIndo(item.createdAt);
        const imgSrc = item.gambar_url || "https://images.unsplash.com/photo-1517048676732-d65bc937f952?q=80&w=400";
        return `
          <a href="/artikel-detail.html?id=${item.id}" class="p-3.5 bg-white rounded-2xl flex gap-3.5 shadow-sm border border-slate-100 hover:border-red-200 transition-all group">
            <img src="${imgSrc}" class="w-24 h-24 object-cover rounded-xl shrink-0 bg-slate-100 group-hover:scale-105 transition-transform" onerror="this.src='https://images.unsplash.com/photo-1517048676732-d65bc937f952?q=80&w=400'" loading="lazy">
            <div class="flex-1 flex flex-col justify-between py-0.5">
              <div>
                <div class="flex items-center justify-between gap-2 mb-1">
                  <span class="text-[9px] font-black uppercase px-2 py-0.5 rounded bg-red-50 text-red-600">${item.kategori || 'Kegiatan'}</span>
                  <span class="text-[9px] text-slate-400 font-bold"><i class="far fa-eye mr-1"></i>${item.views || 0}</span>
                </div>
                <h3 class="font-bold text-xs line-clamp-2 text-slate-800 leading-snug group-hover:text-red-600 transition-colors">${item.judul}</h3>
              </div>
              <div class="flex items-center justify-between text-[10px] text-slate-400 font-semibold pt-1 border-t border-slate-50">
                <span class="truncate max-w-[120px]"><i class="far fa-user text-red-500 mr-1"></i>${item.penulis || 'Admin'}</span>
                <span><i class="far fa-calendar-alt text-slate-400 mr-1"></i>${dateStr}</span>
              </div>
            </div>
          </a>
        `;
      }).join('');
    }

    searchEl.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderList();
    });

    window.setCategory = (cat) => {
      activeCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(btn => {
        if (btn.innerText.trim() === cat) {
          btn.className = 'cat-pill active px-3.5 py-1.5 rounded-full font-bold whitespace-nowrap bg-red-600 text-white shadow-sm transition';
        } else {
          btn.className = 'cat-pill px-3.5 py-1.5 rounded-full font-bold whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:border-red-300 transition';
        }
      });
      renderList();
    };
  </script>
</body>
</html>
