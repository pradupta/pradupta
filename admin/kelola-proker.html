<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelola Dokumentasi Proker - Admin ScoutDupta</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex antialiased">

  <aside id="admin-sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 min-h-screen hidden lg:flex"></aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header id="admin-header"></header>

    <main class="p-6 max-w-6xl w-full mx-auto space-y-6">

      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-xl font-black text-white">Album Dokumentasi Program Kerja</h2>
          <p class="text-xs text-slate-400">Unggah dan kelola foto kegiatan resmi Gerakan Pramuka ScoutDupta.</p>
        </div>
        <button onclick="openAddAlbumModal()" class="px-4 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-black uppercase tracking-wider flex items-center gap-2 shadow-lg shadow-red-600/25 transition">
          <i class="fas fa-plus"></i> Tambah Album Baru
        </button>
      </div>

      <!-- Albums Grid -->
      <div id="admin-proker-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
        <div class="p-8 text-center text-slate-500 col-span-3">Memuat album dari Firestore...</div>
      </div>

    </main>
  </div>

  <!-- Modal Tambah Album -->
  <div id="add-album-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 text-white space-y-4 shadow-2xl relative">
      <button onclick="closeAddAlbumModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-2">
        <i class="fas fa-times"></i>
      </button>

      <div class="flex items-center gap-3 border-b border-slate-800 pb-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold">
          <i class="fas fa-images"></i>
        </div>
        <div>
          <h3 class="text-sm font-black text-white">Tambah Album Kegiatan</h3>
          <p class="text-[10px] text-slate-400">Dokumentasi Program Kerja ScoutDupta</p>
        </div>
      </div>

      <form id="albumForm" class="space-y-3 text-xs">
        <div>
          <label class="block text-[10px] font-extrabold uppercase text-slate-400 mb-1">Nama Kegiatan / Program Kerja</label>
          <input type="text" id="album-name" placeholder="Misal: Penerimaan Tamu Ambalan (PTA)" required class="w-full bg-slate-950 border border-slate-800 focus:border-red-500 rounded-xl px-4 py-2.5 text-white outline-none">
        </div>

        <div>
          <label class="block text-[10px] font-extrabold uppercase text-slate-400 mb-1">Deskripsi Singkat</label>
          <textarea id="album-desc" rows="2" placeholder="Jelaskan ringkasan kegiatan..." class="w-full bg-slate-950 border border-slate-800 focus:border-red-500 rounded-xl px-4 py-2.5 text-white outline-none"></textarea>
        </div>

        <div>
          <label class="block text-[10px] font-extrabold uppercase text-slate-400 mb-1">URL Cover Sampul Album</label>
          <input type="url" id="album-cover" placeholder="https://images.unsplash.com/..." required class="w-full bg-slate-950 border border-slate-800 focus:border-red-500 rounded-xl px-4 py-2.5 text-white outline-none">
        </div>

        <div>
          <label class="block text-[10px] font-extrabold uppercase text-slate-400 mb-1">URL Foto-foto (Pisahkan dengan koma atau baris baru)</label>
          <textarea id="album-photos" rows="3" placeholder="https://images.unsplash.com/...&#10;https://images.unsplash.com/..." class="w-full bg-slate-950 border border-slate-800 focus:border-red-500 rounded-xl px-4 py-2.5 text-white outline-none"></textarea>
        </div>

        <div class="pt-3 border-t border-slate-800 flex justify-end gap-2">
          <button type="button" onclick="closeAddAlbumModal()" class="px-4 py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl">Batal</button>
          <button type="submit" id="btn-save-album" class="px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white font-extrabold rounded-xl shadow-lg">Simpan Album</button>
        </div>
      </form>

    </div>
  </div>

  <script type="module">
    import { protectAdminRoute } from "/admin/js/admin-auth.js";
    import { renderAdminLayout } from "/admin/js/admin-app.js";
    import { db } from "/assets/js/firebase-config.js";
    import { collection, onSnapshot, addDoc, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    await protectAdminRoute();
    renderAdminLayout('proker');

    let albums = [];
    const gridEl = document.getElementById('admin-proker-grid');

    onSnapshot(collection(db, "proker"), snapshot => {
      albums = [];
      snapshot.forEach(docSnap => {
        albums.push({ id: docSnap.id, ...docSnap.data() });
      });
      renderAlbums();
    });

    function renderAlbums() {
      if (albums.length === 0) {
        gridEl.innerHTML = '<div class="p-8 text-center text-slate-500 col-span-3">Belum ada album kegiatan tersimpan.</div>';
        return;
      }

      gridEl.innerHTML = albums.map(a => {
        const cover = a.cover || 'https://images.unsplash.com/photo-1517048676732-d65bc937f952?q=80&w=400';
        const photoCount = (a.photos || []).length;
        return `
          <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-lg flex flex-col justify-between group">
            <div class="relative aspect-video overflow-hidden bg-slate-950">
              <img src="${cover}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
              <div class="absolute top-3 right-3 bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-full text-[10px] font-black text-white">
                ${photoCount} Foto
              </div>
            </div>
            <div class="p-5 flex-1 flex flex-col justify-between">
              <div>
                <h3 class="font-extrabold text-sm text-white">${a.name}</h3>
                <p class="text-xs text-slate-400 mt-1 line-clamp-2">${a.description || 'Dokumentasi kegiatan resmi'}</p>
              </div>
              <div class="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between">
                <a href="/proker.html" target="_blank" class="text-xs text-red-400 hover:text-red-300 font-bold">
                  Lihat Publik &rarr;
                </a>
                <button onclick="hapusAlbum('${a.id}')" class="p-2 rounded-lg bg-rose-600/10 text-rose-400 hover:bg-rose-600/20 text-xs transition">
                  <i class="fas fa-trash-alt"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.openAddAlbumModal = () => document.getElementById('add-album-modal').classList.remove('hidden');
    window.closeAddAlbumModal = () => document.getElementById('add-album-modal').classList.add('hidden');

    document.getElementById('albumForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-save-album');
      btn.disabled = true;

      const name = document.getElementById('album-name').value.trim();
      const desc = document.getElementById('album-desc').value.trim();
      const cover = document.getElementById('album-cover').value.trim();
      const rawPhotos = document.getElementById('album-photos').value.trim();

      const photosList = rawPhotos 
        ? rawPhotos.split(/[\n,]+/).map(s => s.trim()).filter(Boolean)
        : [cover];

      try {
        await addDoc(collection(db, "proker"), {
          name,
          description: desc,
          cover,
          photos: photosList,
          createdAt: new Date().toISOString()
        });

        closeAddAlbumModal();
        e.target.reset();
        Swal.fire({
          icon: 'success',
          title: 'Album Tersimpan',
          text: 'Dokumentasi kegiatan telah ditambahkan.',
          confirmButtonColor: '#dc2626'
        });
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Gagal', text: err.message });
      } finally {
        btn.disabled = false;
      }
    };

    window.hapusAlbum = async (id) => {
      if (confirm("Hapus album proker ini?")) {
        await deleteDoc(doc(db, "proker", id));
      }
    };
  </script>
</body>
</html>
