<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dokumentasi Proker - ScoutDupta</title>
  
  <link rel="icon" type="image/png" href="https://pradupta.my.id/img/logo.png" />
  <link rel="apple-touch-icon" href="https://pradupta.my.id/img/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .card-proker {
      background: white;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    .card-proker:active {
      transform: scale(0.96);
    }
    .text-shadow-lg {
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen pb-24 text-slate-800 antialiased">

  <!-- Header -->
  <header class="header-app p-6 pb-6 sticky top-0 z-30 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <a href="/index.html" class="w-10 h-10 rounded-2xl bg-white/10 hover:bg-white/20 border border-white/20 flex items-center justify-center text-white active:scale-95 transition">
          <i class="fas fa-arrow-left"></i>
        </a>
        <img src="https://pradupta.my.id/img/logo.png" alt="Logo" class="w-9 h-9 object-contain drop-shadow" onerror="this.src='https://pradupta.github.io/web/img/logo.png'">
        <div>
          <p class="text-[10px] text-red-200 font-bold uppercase tracking-wider">Galeri Kegiatan</p>
          <h1 class="text-xl font-black text-white tracking-tight">PROKER KAMI</h1>
        </div>
      </div>
      
      <div id="back-to-grid" class="hidden">
        <button onclick="renderProkerGrid()" class="bg-white text-red-600 text-[10px] px-3.5 py-2 rounded-xl font-black shadow-md active:scale-95 transition flex items-center gap-1.5 uppercase">
          <i class="fas fa-th-large"></i> Semua
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 py-4">
    <div id="proker-content">
      <!-- Loading Shimmer Grid -->
      <div class="grid grid-cols-2 gap-3.5">
        <div class="aspect-[4/5] rounded-3xl skeleton"></div>
        <div class="aspect-[4/5] rounded-3xl skeleton"></div>
        <div class="aspect-[4/5] rounded-3xl skeleton"></div>
        <div class="aspect-[4/5] rounded-3xl skeleton"></div>
      </div>
    </div>
  </main>

  <!-- Photo Lightbox Modal -->
  <div id="lightbox-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center p-4">
    <button onclick="closeLightbox()" class="absolute top-4 right-4 text-white/80 hover:text-white p-3 text-xl z-10">
      <i class="fas fa-times"></i>
    </button>
    <div class="max-w-xl w-full max-h-[80vh] flex items-center justify-center">
      <img id="lightbox-img" src="" class="max-h-[80vh] max-w-full rounded-2xl object-contain shadow-2xl">
    </div>
    <p id="lightbox-caption" class="text-xs text-white/70 mt-3 font-semibold text-center"></p>
  </div>

  <!-- Bottom Navigation Bar (STATIS & HANYA 3 IKON: Home, Berita, Absen) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 py-2.5 z-40 shadow-lg">
    <div class="max-w-md mx-auto grid grid-cols-3 text-center">
      <a href="/index.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-red-600 active:scale-90 transition-transform duration-150">
        <i class="fas fa-home text-lg"></i>
        <span class="text-[10px] font-extrabold mt-0.5">Home</span>
      </a>
      <a href="/berita.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-red-600 active:scale-90 transition-transform duration-150">
        <i class="fas fa-newspaper text-lg"></i>
        <span class="text-[10px] font-extrabold mt-0.5">Berita</span>
      </a>
      <a href="/absen.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-red-600 active:scale-90 transition-transform duration-150">
        <i class="fas fa-camera text-lg"></i>
        <span class="text-[10px] font-extrabold mt-0.5">Absen</span>
      </a>
    </div>
  </nav>

  <script type="module">
    import { db } from "/assets/js/firebase-config.js";
    import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    let albums = [];
    const container = document.getElementById('proker-content');
    const backBtn = document.getElementById('back-to-grid');

    onSnapshot(collection(db, "proker"), (snapshot) => {
      albums = [];
      snapshot.forEach(doc => {
        albums.push({ id: doc.id, ...doc.data() });
      });
      renderProkerGrid();
    });

    window.renderProkerGrid = function() {
      backBtn.classList.add('hidden');
      if (albums.length === 0) {
        container.innerHTML = `
          <div class="py-20 text-center bg-white rounded-3xl border border-slate-100 p-6">
            <i class="far fa-images text-3xl text-slate-300 mb-2"></i>
            <p class="text-xs text-slate-400">Belum ada album dokumentasi proker.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="grid grid-cols-2 gap-3.5">
          ${albums.map(a => `
            <div onclick="openAlbum('${a.id}')" class="card-proker relative aspect-[4/5] rounded-3xl overflow-hidden cursor-pointer group shadow-sm">
              <img src="${a.cover || 'https://images.unsplash.com/photo-1517048676732-d65bc937f952?q=80&w=600'}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" loading="lazy">
              <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent flex flex-col justify-end p-4">
                <span class="text-[10px] text-red-400 font-extrabold uppercase tracking-wider mb-1">${(a.photos || []).length} Foto</span>
                <h3 class="text-white text-xs font-black uppercase leading-snug tracking-wide text-shadow-lg">${a.name}</h3>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    };

    window.openAlbum = function(albumId) {
      const album = albums.find(a => a.id === albumId);
      if (!album) return;

      backBtn.classList.remove('hidden');
      const photos = album.photos || [album.cover];

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center gap-3">
            <div class="h-6 w-1.5 bg-red-600 rounded-full"></div>
            <div>
              <h2 class="text-sm font-black text-slate-900 uppercase tracking-wider">${album.name}</h2>
              <p class="text-[10px] text-slate-400">${album.description || 'Dokumentasi kegiatan resmi ScoutDupta'}</p>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2">
            ${photos.map((url, idx) => `
              <div onclick="openLightbox('${url}', '${album.name} - Foto ${idx+1}')" class="aspect-square rounded-2xl overflow-hidden bg-slate-100 shadow-sm active:scale-95 transition-all cursor-pointer">
                <img src="${url}" class="w-full h-full object-cover hover:opacity-90" loading="lazy">
              </div>
            `).join('')}
          </div>
        </div>
      `;
    };

    window.openLightbox = function(url, caption) {
      document.getElementById('lightbox-img').src = url;
      document.getElementById('lightbox-caption').innerText = caption;
      document.getElementById('lightbox-modal').classList.remove('hidden');
    };

    window.closeLightbox = function() {
      document.getElementById('lightbox-modal').classList.add('hidden');
    };
  </script>
</body>
</html>
